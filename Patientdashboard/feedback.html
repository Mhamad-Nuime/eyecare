<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Management</title>
  <link rel="stylesheet" href="../plugins/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../plugins/icofont/icofont.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/config.js"></script>
  <!-- jQuery and Bootstrap from CDN -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
  crossorigin="anonymous"
/>
<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
  crossorigin="anonymous"
></script>
</head>
<body id="top">

  <!-- Header -->
  <div id="header-placeholder"></div>

  <main class="container mt-5">
    <h2>Feedback Management</h2>
    <div class="my-4">
      <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#add-feedback-modal">Create</button>
    </div>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Message</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="feedback-list">
        <!-- Feedback will be dynamically loaded here -->
      </tbody>
    </table>
            <!-- Add feedback Modal -->
            <div
            class="modal fade"
            id="add-feedback-modal"
            tabindex="-1"
            aria-labelledby="exampleModalLabel"
            aria-hidden="true"
          >
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h1 class="modal-title fs-5" id="exampleModalLabel">
                    Add feedback
                  </h1>
                  <button
                    type="button"
                    id="add-user-close"
                    class="btn-close form-modal-close"
                    data-form-id="add-feedback-form"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                  ></button>
                </div>
                <div class="modal-body">
                  <form id="add-feedback-form" class="w-100 row needs-validation" novalidate onsubmit="event.preventDefault()">
                    <div class="col-12 my-2">
                      <label for="message" class="form-label">title :</label>
                      <input type="text" placeholder="responseText" class="form-control" id="responseText" required>
                      <div class="valid-feedback">looks good</div>
                      <div class="invalid-feedback">invalid</div>
                    </div>
                    <div class="col-12 my-2">
                      <label for="message" class="form-label">Message :</label>
                      <textarea id="message" class="form-control" rows="6" placeholder="Enter any details"></textarea>
                      <div class="valid-feedback">looks good</div>
                      <div class="invalid-feedback">Please enter your message.</div>
                    </div>
                  </form>
                </div>
                <div class="modal-footer">
                  <button
                    type="button"
                    class="btn btn-secondary form-modal-close"
                    data-form-id="add-feedback-form"
                    data-bs-dismiss="modal"
                  >
                    Close
                  </button>
                  <button type="submit" form="add-feedback-form" id="add-feedback-button" onclick="addFeedback()" class="btn btn-primary">
                    Add
                  </button>
                </div>
              </div>
            </div>
          </div>
          <!-- delete feedback Modal -->
          <div
          class="modal fade"
          id="delete-feedback-modal"
          tabindex="-1"
          aria-labelledby="exampleModalLabel"
          aria-hidden="true"
        >
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">
                  Delete Feedback
                </h1>
                <button
                  type="button"
                  class="btn-close"
                  data-form-id="delete-user-form"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <div class="modal-body">
                    <input type="hidden" id="delete-feedback-id">
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-form-id="edit-user-form"
                  data-bs-dismiss="modal"
                >
                  Close
                </button>
                <button type="button" id="delete-appointment-button" class="btn btn-danger" onclick="deleteFeedback()">
                  Delete
                </button>
              </div>
            </div>
          </div>
        </div>
  </main>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

    <!-- back button -->
    <script src="../js/back-button.js"></script>
    <script src="../js/form-validation.js"></script>
    <script src="../js/toaster.js"></script>
  <script src="../js/patient/feedback.js"></script>

    <!-- Main js -->
    <script defer  src="../js/shared/header.js"></script>
    <script defer src="../js/shared/footer.js"></script>
    <script>
      // Load the shared header and footer
      $(function() {
        $("#header-placeholder").load("../shared/header.html", function() {
      // Access the profile links
      const profile = document.getElementById("profile-view-link");
      const logout  = document.getElementById("profile-logout");
      logout.addEventListener("click" , (event) => {
        if(event.target.innerHTML === "Logout"){
          localStorage.removeItem("user");
        }
      })
      let user = JSON.parse(localStorage.getItem("user"));
      if (user) {
        let dashUrl;
        switch(user.role) {
              case 'Patient':
                  dashUrl = '../Patientdashboard/patient-dashboard.html';
                  break;
              case 'Doctor':
                  dashUrl = '../doctordash/doctor-dashboard.html';
                  break;
              case 'Admin':
                  dashUrl = '../admindash/admin-dashboard.html';
                  break;
              case 'SuperAdmin':
                  dashUrl = '../Superadmindash/superadmin-dashboard.html';
                  break;
          }
        profile.innerHTML = "View Profile";
        profile.setAttribute("href", dashUrl);
        logout.innerHTML = "Logout";
        logout.setAttribute("href", "../shared/login.html");
      } else {
        profile.innerHTML = "View Profile";
        profile.setAttribute("href", "../shared/login.html");
        logout.innerHTML = "Login";
        logout.setAttribute("href", "../shared/login.html");
      }
      fetchHeaderContactInfo();
    });
        $("#footer-placeholder").load("../shared/footer.html" ,function(){
          loadFooterContent();
        });
      });
    </script>
</body>
</html>
