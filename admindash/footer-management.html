<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Footer Management</title>
  <link rel="stylesheet" href="../plugins/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../plugins/icofont/icofont.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/config.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
  crossorigin="anonymous"
/>
<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
  crossorigin="anonymous"
></script>
    <!-- back button -->
    <script src="../js/back-button.js"></script>
</head>
<body id="top">

  <!-- Header -->
  <div id="header-placeholder"></div>

  <main class="container mt-5">
    <h2>Footer Management</h2>
    <form id="footerForm">
      <div class="form-group">
        <label for="footerDescription">Description</label>
        <textarea class="form-control" id="footerDescription" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label for="footerEmail">Support Email</label>
        <input type="email" class="form-control" id="footerEmail" placeholder="">
      </div>
      <div class="form-group">
        <label for="footerPhone">Support Phone Number</label>
        <input type="text" class="form-control" id="footerPhone" placeholder="">
      </div>
      <div class="text-color-primary my-3" style="text-align: center;font-size: 2rem;">Support Links</div>
      <div class="form-group">
        <div class="row">
          <div class="col-md-6">
            <input type="text" class="form-control" id="link-text" placeholder="Link's Text">
          </div>
          <div class="col-md-6">
            <input type="email" class="form-control" id="link-href" placeholder="Link's Href">
          </div>
          <div class="my-2 w-100">
            <button class="btn btn-light w-100" onclick="addLink(event)">Add Support Links +</button>
          </div>
        </div>
        <div>
          <ul id="links-list" class="d-flex flex-wrap"></ul>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" onclick="saveFooter(event)">Save Footer</button>
    </form>
  </main>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <script src="../js/toaster.js"></script>
  <script src="../js/admin/footer-management.js"></script>
    <!-- Main js -->
    <script defer  src="../js/shared/header.js"></script>
    <script defer src="../js/shared/footer.js"></script>
    <script>
      // Load the shared header and footer
      $(function() {
        $("#header-placeholder").load("../shared/header.html", function() {
      // Access the profile links
      const profile = document.getElementById("profile-view-link");
      const logout  = document.getElementById("profile-logout");
      logout.addEventListener("click" , (event) => {
        if(event.target.innerHTML === "Logout"){
          localStorage.removeItem("user");
        }
      })
      let user = JSON.parse(localStorage.getItem("user"));
      if (user) {
        let dashUrl;
        switch(user.role) {
              case 'Patient':
                  dashUrl = '../Patientdashboard/patient-dashboard.html';
                  break;
              case 'Doctor':
                  dashUrl = '../doctordash/doctor-dashboard.html';
                  break;
              case 'Admin':
                  dashUrl = '../admindash/admin-dashboard.html';
                  break;
              case 'SuperAdmin':
                  dashUrl = '../Superadmindash/superadmin-dashboard.html';
                  break;
          }
        profile.innerHTML = "View Profile";
        profile.setAttribute("href", dashUrl);
        logout.innerHTML = "Logout";
        logout.setAttribute("href", "../shared/login.html");
      } else {
        profile.innerHTML = "View Profile";
        profile.setAttribute("href", "../shared/login.html");
        logout.innerHTML = "Login";
        logout.setAttribute("href", "../shared/login.html");
      }
      fetchHeaderContactInfo();
    });
        $("#footer-placeholder").load("../shared/footer.html" ,function(){
          loadFooterContent();
        });
      });
    </script>
</body>
</html>
