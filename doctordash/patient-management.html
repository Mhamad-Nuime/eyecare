<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="../css/style.css">
   
    
</head>
<body>
    <!-- Load Header -->
    <div id="header-placeholder"></div>

    <main class="container mt-5">
        <h2>Patient Management</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPatientModal">Add Patient</button>

        <table class="table mt-3" id="patientTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Clinic</th>
                   
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </main>

    <!-- Modals for Adding, Viewing, Editing, and Deleting Patients -->
    
 <!-- Patient Profile Modal -->
 <div id="viewProfileModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Patient Profile</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                  <!-- Tabs for Profile Sections -->
                  <ul class="nav nav-tabs" id="profileTab" role="tablist">
                    <li class="nav-item">
                        <a class="nav-link active" id="basic-info-tab" data-bs-toggle="tab" href="#basic-info" role="tab">Basic Info</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="medical-profile-tab" data-bs-toggle="tab" href="#medical-profile" role="tab">Medical Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="user-profile-tab" data-bs-toggle="tab" href="#user-profile" role="tab">User Profile</a>
                    </li>
                </ul>
                 <!-- Tab Content -->
                 <div class="tab-content mt-3" id="profileTabContent">
                    <!-- Basic Info Tab -->
                    <div class="tab-pane fade show active" id="basic-info" role="tabpanel">
                        <p><strong>Name:</strong> <span id="patientNameView"></span></p>
                        <p><strong>Email:</strong> <span id="patientEmailView"></span></p>
                        <p><strong>Phone:</strong> <span id="patientPhoneView"></span></p>
                    </div>
                      <!-- Medical Profile Tab -->
                    <div class="tab-pane fade" id="medical-profile" role="tabpanel">
                        <form id="medicalProfileForm">
                            <input type="hidden" id="patientId">
                            <input type="hidden" id="medicalProfileId">
                            <div class="mb-3">
                                <label for="medicalHistory" class="form-label">Medical History</label>
                                <textarea id="medicalHistory" class="form-control"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="medications" class="form-label">Medications</label>
                                <input type="text" id="medications" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label for="allergies" class="form-label">Allergies</label>
                                <input type="text" id="allergies" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label for="bloodType" class="form-label">Blood Type</label>
                                <input type="text" id="bloodType" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label for="medicalAttachment">Medical Document</label>
                                <input type="file" class="form-control" id="medicalAttachment" accept="application/pdf,image/*">
                                <a id="medicalAttachmentLink" href="#" target="_blank" style="display: none;" class="btn btn-secondary mt-2">Download Attachment</a>
                                <div id="attachmentPreview" class="mt-3"></div>
<button id="deleteAttachment" class="btn btn-danger mt-2" style="display:none;">Delete Attachment</button>
                                
                            </div>
                            <button type="button" id="saveMedicalProfileBtn" class="btn btn-primary" onclick="saveMedicalProfile()" disabled>Save Medical Profile</button>
                        </form>
                    </div>
                      <!-- User Profile Tab -->
                      <div class="tab-pane fade" id="user-profile" role="tabpanel">
                        <form id="userProfileForm">
                            <input type="hidden" id="userProfileId">
                            <div class="mb-3">
                                <label for="address" class="form-label">Address</label>
                                <input type="text" id="address" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label for="phoneNumber" class="form-label">Phone Number</label>
                                <input type="text" id="phoneNumber" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label for="profileImageUpload" class="form-label">Profile Image</label>
                                <input type="file" class="form-control" id="profileImageUpload" accept="image/*">
                                <div id="profileImagePreview" class="mt-2"></div>
                            </div>
                            <button type="button" class="btn btn-primary" onclick="saveUserProfile()">Save User Profile</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

    <!-- Load Footer -->
    <div id="footer-placeholder"></div>
         <!-- Main JS -->
    <script defer  src="../js/shared/header.js"></script>
    <script defer src="../js/shared/footer.js"></script>
    <script src="../js/toaster.js"></script>
    <script src="../js/back-button.js"></script>
    <script src="../js/doctor/patient-management.js" defer></script>
    <!-- Load the shared header and footer -->
    <script>
        // Load the shared header and footer
        $(function() {
          $("#header-placeholder").load("../shared/header.html", function() {
        // Access the profile links
        const profile = document.getElementById("profile-view-link");
        const logout  = document.getElementById("profile-logout");
        logout.addEventListener("click" , (event) => {
          if(event.target.innerHTML === "Logout"){
            localStorage.removeItem("user");
          }
        })
            let userJson = localStorage.getItem("user");
    let user = JSON.parse(userJson);
        if (user) {
          let dashUrl;
          switch (user.role) {
                case 'Patient':
                    dashUrl = '../Patientdashboard/patient-dashboard.html';
                    break;
                case 'Doctor':
                    dashUrl = '../doctordash/doctor-dashboard.html';
                    break;
                case 'Admin':
                    dashUrl = '../admindash/admin-dashboard.html';
                    break;
                case 'SuperAdmin':
                    dashUrl = '../Superadmindash/superadmin-dashboard.html';
                    break;
            }
          profile.innerHTML = "View Profile";
          profile.setAttribute("href", dashUrl);
          logout.innerHTML = "Logout";
          logout.setAttribute("href", "../shared/login.html");
        } else {
          profile.innerHTML = "View Profile";
          profile.setAttribute("href", "../shared/login.html");
          logout.innerHTML = "Login";
          logout.setAttribute("href", "../shared/login.html");
        }
        fetchHeaderContactInfo();
      });
          $("#footer-placeholder").load("../shared/footer.html" ,function(){
            loadFooterContent();
          });
        });
      </script>
</body>
</html>
