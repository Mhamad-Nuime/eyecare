<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="User Profile - Eye Care" />
    <meta name="author" content="eyecare.com" />

    <title>Eye Care - Profile</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- Favicon -->
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="../mock-updata/logo.png"
    />
    <!-- jQuery and Bootstrap from CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <!-- Plugins CSS -->
    <link rel="stylesheet" href="../plugins/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../plugins/icofont/icofont.min.css" />
    <link rel="stylesheet" href="../plugins/slick-carousel/slick/slick.css" />
    <link
      rel="stylesheet"
      href="../plugins/slick-carousel/slick/slick-theme.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <!-- Include Header -->
    <div id="header-placeholder"></div>



    <div class="container my-5">
      <div class="card mx-auto" style="max-width: 800px">
        <div class="card-body text-center">
          <h5 class="card-title mb-4">Profile Info</h5>

          <div class="d-flex flex-row justify-content-around">
            <div class="info-picture">
              <!-- Profile Picture Preview -->
              <!-- <img
                id="profilePicture"
                src="http://eyecare.somee.com/api/files/image/05c2b970-2790-4776-9728-4e9f7a534b63_logo.png"
                alt="Profile Picture"
                class="rounded-circle mb-3"
                width="150"
                height="150"
              /> -->
              <img
                id="profilePicture"
                src="../images/blank-user.jpg"
                alt="Profile Picture"
                class="rounded-circle mb-3"
                width="150"
                height="150"
              />
  
              <!-- File Input with Label and Button -->
              <form id="uploadForm" enctype="multipart/form-data">
                <div class="mb-3">
                  <label
                    for="fileInput"
                    class="form-label btn btn-outline-primary"
                  >
                    Choose New Picture
                  </label>
                  <input
                    type="file"
                    class="form-control d-none"
                    id="fileInput"
                    accept="image/*"
                    onchange="previewImage(event)"
                  />
                </div>
  
                <button
                  type="button"
                  class="btn btn-primary"
                  onclick="saveProfilePicture()"
                >
                  Save Changes
                </button>
              </form>
            </div>
                     <!-- User Info -->
                <div class="profile-info-container">
                <div class="d-flex flex-column align-items-start justify-content-center">
                  <div class="d-flex justify-content-between w-100 mb-3">
                    <!-- <p class="profile-info-text mb-0 text-muted mb-1">Username:</p> -->
                    <span  class="badge rounded-pill bg-primary text-white fs-6 p-2">Username</span>
                    <span id="username" class="badge rounded-pill bg-secondary text-white fs-6 p-2">Loading...</span>
                  </div>
                  <div class="d-flex justify-content-between w-100 mb-3">
                    <!-- <p class="profile-info-text mb-0 text-muted mb-1">Email:</p> -->
                    <span  class="badge rounded-pill bg-primary text-white fs-6 p-2">Email</span>
                    <span id="email" class="badge rounded-pill bg-secondary text-white fs-6 p-2">Loading...</span>
                  </div>
                  <!-- Additional info fields can be added here -->
                </div>
              </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Include Footer -->
    <div id="footer-placeholder"></div>

    <!-- Google Translate Initialization -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: "en",
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          },
          "google_translate_element"
        );
      }
    </script>
    <!-- Plugins JS -->

    <script src="../plugins/bootstrap/js/popper.js"></script>
    <script src="../plugins/bootstrap/js/bootstrap.min.js"></script>
    <script src="../plugins/slick-carousel/slick/slick.min.js"></script>
    <script src="../js/toaster.js"></script>
    
    <!-- Main JS -->
    <script src="../js/shared/header.js"></script>
    <script src="../js/shared/footer.js"></script>
    <script defer src="../js/shared/profile.js"></script>
    <script src="../js/back-button.js"></script>
    <script>
      // Load the shared header and footer
      $(function () {
        $("#header-placeholder").load("../shared/header.html", function () {
          // Access the profile links
          const profile = document.getElementById("profile-view-link");
          const logout = document.getElementById("profile-logout");
          logout.addEventListener("click", (event) => {
            if (event.target.innerHTML === "Logout") {
              localStorage.removeItem("user");
            }
          });
          let user = JSON.parse(localStorage.getItem("user"));
          if (user) {
            let dashUrl;
            switch (user.role) {
              case "Patient":
                dashUrl = "../Patientdashboard/patient-dashboard.html";
                break;
              case "Doctor":
                dashUrl = "../doctordash/doctor-dashboard.html";
                break;
              case "Admin":
                dashUrl = "../admindash/admin-dashboard.html";
                break;
              case "SuperAdmin":
                dashUrl = "../Superadmindash/superadmin-dashboard.html";
                break;
            }
            profile.innerHTML = "View Profile";
            profile.setAttribute("href", dashUrl);
            logout.innerHTML = "Logout";
            logout.setAttribute("href", "../shared/login.html");
          } else {
            profile.innerHTML = "View Profile";
            profile.setAttribute("href", "../shared/login.html");
            logout.innerHTML = "Login";
            logout.setAttribute("href", "../shared/login.html");
          }
          fetchHeaderContactInfo();
        });
        $("#footer-placeholder").load("../shared/footer.html", function () {
          loadFooterContent();
        });
      });
    </script>
  </body>
</html>
